kind = "web"
previewPath = "/"
title = "Anderson Personal Trainer"
version = "1.0.0"
id = "artifacts/anderson-pt"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26075

[services.development]
run = "pnpm --filter @workspace/anderson-pt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anderson-pt", "run", "build" ]
serve = "static"
publicDir = "artifacts/anderson-pt/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26075"
BASE_PATH = "/"
